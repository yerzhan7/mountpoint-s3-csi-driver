{{- $daemonsetMounterMode := eq .Values.experimental.mounterMode "daemonset" -}}
{{- $dynamicProvisioning := eq (include "aws-mountpoint-s3-csi-driver.dynamicProvisioning" .) "true" -}}
{{/* In daemonset mounter mode there are no Mountpoint Pods to reconcile, the controller is only
     needed to serve CSI's controller service for dynamic provisioning. */}}
{{- if or (not $daemonsetMounterMode) $dynamicProvisioning -}}
kind: Deployment
apiVersion: apps/v1
metadata:
  name: s3-csi-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aws-mountpoint-s3-csi-driver.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-csi-controller
      {{- include "aws-mountpoint-s3-csi-driver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: s3-csi-controller
        {{- include "aws-mountpoint-s3-csi-driver.labels" . | nindent 8 }}
        {{- if .Values.controller.podLabels }}
        {{- toYaml .Values.controller.podLabels | nindent 8 }}
        {{- end }}
    spec:
      nodeSelector:
        kubernetes.io/os: linux
        {{- with .Values.controller.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      serviceAccountName: {{ .Values.controller.serviceAccount.name }}
      priorityClassName: system-cluster-critical
      {{- with .Values.controller.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        # TODO: Should we add some default tolerations for controller?
        {{- with .Values.controller.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      containers:
        - name: s3-csi-controller
          image: {{ include "csiDriverImageName" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - "/bin/aws-s3-csi-controller"
          {{- if $dynamicProvisioning }}
          args:
            - --csi-endpoint=$(CSI_ENDPOINT)
          {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            {{- with .Values.controller.seLinuxOptions }}
            seLinuxOptions:
              user: {{ .user }}
              type: {{ .type }}
              role: {{ .role }}
              level: {{ .level }}
            {{- end }}
          # TODO: Healthcheck for the controller.
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: MOUNTPOINT_IMAGE
              value: {{ include "csiDriverImageName" . }}
            - name: MOUNTPOINT_IMAGE_PULL_POLICY
              value: {{ .Values.image.pullPolicy }}
            - name: MOUNTPOINT_NAMESPACE
              value: {{ .Values.mountpointPod.namespace }}
            - name: MOUNTPOINT_PRIORITY_CLASS_NAME
              value: {{ .Values.mountpointPod.priorityClassName }}
            - name: MOUNTPOINT_POD_LABELS
              value: {{ toJson .Values.mountpointPod.podLabels | quote }}
            {{- if .Values.experimental.reserveHeadroomForMountpointPods }}
            - name: MOUNTPOINT_HEADROOM_POD_LABELS
              value: {{ toJson .Values.experimental.headroomPodLabels | quote }}
            - name: MOUNTPOINT_PREEMPTING_PRIORITY_CLASS_NAME
              value: {{ .Values.mountpointPod.preemptingPriorityClassName }}
            - name: MOUNTPOINT_HEADROOM_PRIORITY_CLASS_NAME
              value: {{ .Values.mountpointPod.headroomPriorityClassName }}
            - name: MOUNTPOINT_HEADROOM_IMAGE
              value: {{ .Values.experimental.headroomPodImage }}
            {{- end }}
            {{- if $daemonsetMounterMode }}
            - name: MOUNTER_MODE
              value: daemonset
            {{- end }}
            {{- if $dynamicProvisioning }}
            - name: ENABLE_DYNAMIC_PROVISIONING
              value: "true"
            - name: CSI_ENDPOINT
              value: unix:///var/lib/csi/sockets/pluginproxy/csi.sock
            {{- end }}
          {{- if $dynamicProvisioning }}
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
          {{- end }}
        {{- if $dynamicProvisioning }}
        - name: csi-provisioner
          image: {{ include "provisionerImageName" . }}
          imagePullPolicy: {{ default .Values.image.pullPolicy .Values.sidecars.provisioner.image.pullPolicy }}
          args:
            - --csi-address=$(ADDRESS)
            # Passes the PersistentVolume and PersistentVolumeClaim identity as `CreateVolume`
            # parameters, which the CSI Driver needs to resolve the `prefixPattern` StorageClass parameter.
            - --extra-create-metadata
            - --leader-election
            - --leader-election-namespace=$(NAMESPACE)
            - --v={{ .Values.sidecars.provisioner.logLevel }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
          {{- with default .Values.controller.resources .Values.sidecars.provisioner.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- if $dynamicProvisioning }}
      volumes:
        - name: socket-dir
          emptyDir: {}
      {{- end }}
{{- end }}
